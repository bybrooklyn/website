# The walking mini's engine: a creature that learns to walk, and the small physics it walks in.
# Built for the browser as a plain WebAssembly module with `bun run wasm`; see README.md.

[package]
name = "walker"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# With neither feature the module holds the physics alone, to keep it small enough to use elsewhere.
# `walker` is the Walker mini's engine and `generalist` the generalist's; each is built into a module
# of its own (`bun run wasm`), and both are on for `cargo test`.
default = ["walker", "generalist"]
walker = ["creature"]
generalist = ["creature"]
# What both share: the body, the brain and evolution.
creature = []

# The fingerprint test and the examples use parts of the crate that only some features build, so
# `cargo test` compiles with any of the feature sets `bun run wasm` builds: none, `walker` or
# `generalist`, as well as both.
[[test]]
name = "unchanged"
required-features = ["walker"]

[[example]]
name = "speed"
required-features = ["creature"]

[[example]]
name = "baseline"
required-features = ["generalist"]

[[example]]
name = "compare"
required-features = ["generalist"]

[[example]]
name = "practice"
required-features = ["generalist"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
panic = "abort"

# Tests run the physics for many seconds, which is slow without optimising.
[profile.test]
opt-level = 3

[[example]]
name = "touched"
required-features = ["generalist"]
