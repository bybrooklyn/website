# Builds the site and puts it on Cloudflare Pages. It runs only when asked: from the Actions page,
# or by the publish button in mdQuire. A push or a pull request never starts it, so nothing is
# deployed by accident and a stranger's pull request cannot run with the site's secrets.
#
# It needs two repository secrets: CLOUDFLARE_API_TOKEN (a token that may edit Cloudflare Pages)
# and CLOUDFLARE_ACCOUNT_ID.

name: publish

on:
    workflow_dispatch:
        inputs:
            branch:
                description: "Where it goes: main is the real site, anything else a preview address"
                default: preview

permissions:
    contents: read

concurrency:
    group: publish
    cancel-in-progress: false

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
            - run: bun install --frozen-lockfile
            - run: bun run check
            - run: bun run build
            - run: bunx wrangler pages deploy --branch "${{ inputs.branch }}"
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
